# F002 AI Provider 配置（spec §5.3）
#
# 参考来源：opencode GLM-5.2 配置 + 铲屎官 AI SDK 风格（多 provider 多 model）
# apiKey 两种配置方式：
#   api_key: sk-xxx          # 直填（AI SDK 风格，优先）——🔴 仅限私有仓库 / 本地不入库配置
#   api_key_env: ENV_NAME    # 走环境变量（key 不入库，安全默认，公开仓库必须用这种）
#
# 运行时切换：
#   load_provider("euler-y", model="GLM-5.3-Flash")
#   # 或 CLI: jd-analyze run --llm --llm-provider euler-y --llm-model GLM-5.3-Flash
#   # 或 web 页面 sidebar 模型切换
#
# 两种格式均支持：
#   新格式（多 model）：providers.<name>.models.<model_id> map
#   老格式（单 model）：providers.<name>.model 顶层字段

default_provider: euler-y

providers:
  # ===== 主力 provider（csi endpoint，key 只能访问 pool_0010 池）=====
  # 注意：此 key 访问 Deepseek-V4-Flash / GLM-5.2 会 403（key_model_access_denied），
  # 已实测可用的 model：GLM-5.3-Flash / GLM-5.3 / Qwen3.8-Flash / DeepSeek-V4-Pro / MiniMax-M3
  # 🔴 key 走环境变量（公开仓库安全策略 spec §5.3）：
  #   set EULER_Y_API_KEY=sk-xxx（本地 powershell: $env:EULER_Y_API_KEY="sk-xxx"）
  euler-y:
    name: csi
    base_url: http://113.46.219.251:8080/v1/
    api_key_env: EULER_Y_API_KEY
    protocol: openai
    timeout_seconds: 120
    default_model: GLM-5.3-Flash
    models:
      GLM-5.3-Flash:
        name: GLM-5.3-Flash
        max_tokens: 4000
        temperature: 0.3
      GLM-5.3:
        name: GLM-5.3
        max_tokens: 4000
      Qwen3.8-Flash:
        name: Qwen3.8-Flash
      DeepSeek-V4-Pro:
        name: DeepSeek-V4-Pro
      MiniMax-M3:
        name: MiniMax-M3

  # ===== 备用 provider（占位，老格式顶层 model 示例）=====
  anthropic:
    name: anthropic
    base_url: https://api.anthropic.com/v1/
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
    protocol: anthropic
    temperature: 0.3
    max_tokens: 4000
    timeout_seconds: 120

# Plan 生成器专用 prompt
plan_generator:
  system_prompt: |
    你是数据分析 Plan 生成器。基于用户问题和数据集 schema，生成一个执行 Plan。

    约束：
    1. 只能调用清单内的原子能力
    2. args 必须符合 args_schema
    3. 输出严格 JSON，不要任何解释文字

    输出 JSON 结构：
    {
      "plan_id": "<auto-gen-uuid>",
      "intent": "<意图标签>",
      "schema_fingerprint": "<匹配输入>",
      "steps": [
        {"op": "clean.<name>"|"model.<name>", "args": {...}}
      ],
      "reviewer_enabled": true|false,
      "fallback_strategy": "abort_on_first_error"|"continue_on_error"
    }

# Reviewer 专用 prompt（spec §5.2 三段式）
reviewer:
  system_prompt: |
    你是数据分析师 AI Reviewer。基于数据摘要 + 图表 + 执行日志，
    输出 Markdown 三段式报告：

    ## 异常解释
    （检测到的异常及其可能原因）

    ## 趋势点睛
    （关键趋势 / 排名变迁 / 结构性变化）

    ## 建议下一步
    （推荐的下一步分析方向）
