[project]
name = "jd-brand-analytics"
version = "0.1.0"
description = "京东品类品牌销售数据采集与分析工具"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "郭嘉/奉孝", email = "ragdoll-pa82@clowder.ai" },
]

dependencies = [
    "scrapy>=2.11,<3.0",
    "scrapy-playwright>=0.6",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "httpx>=0.27",
    "curl-cffi>=0.6",           # TLS JA3 fingerprint
    "fake-useragent>=1.4",
    "pandas>=2.1",
    "pandera>=0.18",            # Schema validation
    "pyarrow>=15.0",            # Parquet I/O
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",            # DB migrations
    "structlog>=24.1",          # Structured logging
    "tenacity>=8.2",            # Retry logic
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-pyyaml",
]
prod = [
    "psycopg2-binary>=2.9",     # Postgres
    "redis>=5.0",               # Distributed queue (A3 path)
]

[project.scripts]
jd-collect = "jd_analytics.cli:collect"
jd-export = "jd_analytics.cli:export"
jd-report = "jd_analytics.cli:report"

[tool.scrapy]
settings = "jd_analytics.settings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=jd_analytics --cov-report=term-missing"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
