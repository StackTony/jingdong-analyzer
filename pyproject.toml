[project]
name = "jd-brand-analytics"
version = "0.1.0"
description = "京东品类品牌销售数据采集与分析工具（参考 JD_Spider 极简实现）"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "郭嘉/奉孝", email = "ragdoll-pa82@clowder.ai" },
]

# 极简依赖：DrissionPage 真实浏览器 + 网络监听（替代 scrapy+playwright）
dependencies = [
    "DrissionPage>=4.1",         # 真实浏览器 + listen 网络监听
    "scrapy>=2.11,<3.0",         # 保留 scrapy 框架（pipelines/middlewares 复用）
    "pandas>=2.0",
    "pyarrow>=14.0",            # Parquet I/O
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
ocr = [
    # OCR 路线（可选，spec F001-ocr-route）
    # paddleocr + paddlepaddle 较重，按需安装：pip install -e ".[ocr]"
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
]
ai = [
    # F002 LLM 真实接入（可选，spec §5.3）
    # pip install -e ".[ai]" 启用真实 LLM provider
    "openai>=1.0",              # OpenAI 兼容协议（csi / GLM / 任意 OpenAI-compatible）
    "plotly>=5.0",              # Visualizer 渲染（已在 P1 用）
    "scikit-learn>=1.0",        # Modeler cluster op（可选）
]
viz = [
    # F002 Visualizer 可视化（可选）
    "plotly>=5.0",
    "streamlit>=1.30",          # Streamlit 面板（P5）
]

[project.scripts]
jd-collect = "jd_analytics.cli:collect"
jd-export = "jd_analytics.cli:export"
jd-report = "jd_analytics.cli:report"

[tool.scrapy]
settings = "jd_analytics.settings"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
